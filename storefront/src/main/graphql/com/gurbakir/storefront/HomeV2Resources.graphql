query HomeV2Resources($ids: [ID!]!) {
  nodes(ids: $ids) {
    __typename
    id
    ... on Collection {
      handle
      title
      image {
        id
        altText
        url
        width
        height
      }
      products(first: 1) {
        nodes {
          featuredImage {
            id
            altText
            url
            width
            height
          }
        }
      }
    }
    ... on Product {
      handle
      title
      availableForSale
      featuredImage {
        id
        altText
        url
        width
        height
      }
      priceRange {
        minVariantPrice {
          amount
          currencyCode
        }
      }
    }
    ... on MediaImage {
      alt
      mediaContentType
      image {
        id
        altText
        url
        width
        height
      }
    }
    ... on Video {
      alt
      mediaContentType
      previewImage {
        id
        altText
        url
        width
        height
      }
      sources {
        format
        height
        mimeType
        url
        width
      }
    }
  }
}
