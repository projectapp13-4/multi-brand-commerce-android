name: Android foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Public-readiness validator self-tests
        shell: pwsh
        run: ./scripts/Test-PublicReadiness.ps1 -SelfTest

      - name: Public-readiness validator
        shell: pwsh
        run: ./scripts/Test-PublicReadiness.ps1 -RequireCleanWorktree

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          dependency-graph: disabled

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Format and static analysis
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --no-configuration-cache spotlessCheck detekt lint
          status=$?
          if [ "$status" -ne 0 ]; then
            while IFS= read -r report; do
              echo "::group::${report}"
              cat "$report"
              echo "::endgroup::"
            done < <(find . -type f -name 'lint-results-*.txt' -print | sort)
          fi
          exit "$status"

      - name: JVM foundation tests
        run: >-
          ./gradlew --no-daemon
          :mobile-core:testDebugUnitTest
          :foundation:testDebugUnitTest
          :account:testDebugUnitTest
          :checkout:testDebugUnitTest
          :storefront:testDebugUnitTest
          :firebase:testDebugUnitTest
          :synthetic:testDebugUnitTest
          :app:testDevelopmentDebugUnitTest
          :app:testStagingDebugUnitTest

      - name: Development and staging package verification
        run: >-
          ./gradlew --no-daemon
          :mobile-core:assembleDebug
          :mobile-core:assembleRelease
          :app:assembleDevelopmentDebug
          :app:assembleDevelopmentRelease
          :app:assembleStagingDebug
          :app:assembleStagingRelease
          :app:assembleDevelopmentDebugAndroidTest
          :app:assembleStagingDebugAndroidTest
          :synthetic:assembleDebug
          :synthetic:assembleRelease
          :synthetic:assembleDebugAndroidTest

      - name: Synthetic package contract
        shell: pwsh
        run: |
          ./scripts/Test-Gate2SyntheticPackage.ps1 -SelfTest
          ./scripts/Test-Gate2SyntheticPackage.ps1 -Variant All

      - name: Repository portability validator self-tests
        shell: pwsh
        run: ./scripts/Test-RepositoryPortability.ps1 -SelfTest

      - name: Repository portability validator
        shell: pwsh
        run: ./scripts/Test-RepositoryPortability.ps1 -RequireCleanWorktree

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reclaim disk for Android emulator
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Disk before cleanup ==="
          df -h /

          for path in \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet
          do
            if [ -e "$path" ]; then
              echo "Removing unused toolchain: $path"
              sudo du -sh "$path" 2>/dev/null || true
              sudo rm -rf "$path"
            fi
          done

          sudo apt-get clean || true
          sudo docker system prune -af || true

          echo "=== Disk after cleanup ==="
          df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android platform and emulator
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse0

      - name: Diagnose Android emulator acceleration
        shell: bash
        run: |
          set -euxo pipefail
          uname -a
          id
          groups
          ls -l /dev/kvm || true
          stat /dev/kvm || true
          lsmod | grep -E '^kvm' || true
          grep -E -m 1 '(vmx|svm)' /proc/cpuinfo || true
          "$ANDROID_SDK_ROOT/emulator/emulator" -version
          set +e
          "$ANDROID_SDK_ROOT/emulator/emulator" -accel-check
          accel_status=$?
          set -e
          echo "emulator_accel_check_exit=$accel_status"
          sdkmanager --list_installed

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          dependency-graph: disabled

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Show runner disk space before instrumentation
        run: df -h

      - name: Core and development instrumentation tests
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :account:ciApi30DebugAndroidTest
          :storefront:ciApi30DebugAndroidTest
          :mobile-core:ciApi30DebugAndroidTest
          :app:ciApi30DevelopmentDebugAndroidTest
          :synthetic:ciApi30DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace --info

  minimum-sdk-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reclaim disk for Android emulator
        shell: bash
        run: |
          set -euo pipefail
          for path in /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/dotnet; do
            if [ -e "$path" ]; then
              sudo rm -rf "$path"
            fi
          done
          sudo apt-get clean || true
          sudo docker system prune -af || true

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android platform and emulator
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator"

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Android emulator runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libpulse0

      - name: Keep legacy API 23 ADB visible during managed-device boot
        shell: bash
        run: |
          set -euo pipefail
          mv "$ANDROID_SDK_ROOT/emulator/emulator" "$ANDROID_SDK_ROOT/emulator/emulator.real"
          install -m 0755 scripts/Run-Api23ManagedEmulator.sh "$ANDROID_SDK_ROOT/emulator/emulator"
          "$ANDROID_SDK_ROOT/emulator/emulator" -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          dependency-graph: disabled

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Synthetic minimum-SDK instrumentation tests
        run: >-
          ./gradlew --no-daemon --no-configuration-cache
          :synthetic:ciApi23DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --stacktrace --info
